<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Yacht Runner</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#bfe6f5, #eaf7fb);
    color: #12384f;
    font-family: "Courier New", monospace;
    text-align: center;
  }

  h1 {
    font-size: 1.1rem;
    letter-spacing: 2px;
    margin: 0 0 12px;
  }

  #gameCanvas {
    background: linear-gradient(#bfe6f5 60%, #2a8fc0 60%);
    border-bottom: 2px solid #12384f;
    touch-action: none;
  }

  #hint {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #4c7690;
  }

  #score {
    position: fixed;
    top: 16px;
    right: max(16px, calc(50% - 300px));
    font-size: 0.9rem;
    letter-spacing: 1px;
    color: #12384f;
  }
</style>
</head>
<body>

  <h1>🥂 APPUIE SUR ESPACE / CLIC / TAP POUR SAUTER</h1>
  <canvas id="gameCanvas" width="600" height="200"></canvas>
  <p id="hint">Espace ou clic pour démarrer</p>
  <div id="score">SCORE: 0 &nbsp; HI: 0</div>
  <audio id="jumpSound" src="sounds/jump.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    const scoreEl = document.getElementById('score');

    const GROUND_Y = 160;
    const GRAVITY = 0.6;
    const JUMP_FORCE = -10.5;

    let highScore = Number(localStorage.getItem('dinoHighScore') || 0);

    let dino, obstacles, speed, score, frame, running, gameOver;

    const jumpSound = document.getElementById('jumpSound');
    function playJumpSound() {
      jumpSound.currentTime = 0;
      jumpSound.play().catch(() => {});
    }

    function resetGame() {
      dino = { x: 40, y: GROUND_Y, w: 30, h: 30, vy: 0, jumping: false, duckFrame: 0 };
      obstacles = [];
      speed = 6;
      score = 0;
      frame = 0;
      running = true;
      gameOver = false;
      hint.textContent = '';
    }

    function spawnObstacle() {
      const isDisco = Math.random() < 0.2 && score > 300;
      if (isDisco) {
        const height = [130, 150][Math.floor(Math.random() * 2)];
        obstacles.push({ x: canvas.width, y: height, w: 26, h: 26, type: 'disco' });
      } else {
        const size = 20 + Math.random() * 16;
        obstacles.push({ x: canvas.width, y: GROUND_Y + (30 - size), w: size * 0.55, h: size, type: 'bottle' });
      }
    }

    function jump() {
      if (!running && !gameOver) {
        resetGame();
        requestAnimationFrame(loop);
        return;
      }
      if (gameOver) {
        resetGame();
        requestAnimationFrame(loop);
        return;
      }
      if (!dino.jumping) {
        dino.vy = JUMP_FORCE;
        dino.jumping = true;
        playJumpSound();
      }
    }

    function update() {
      frame++;

      dino.vy += GRAVITY;
      dino.y += dino.vy;
      if (dino.y > GROUND_Y) {
        dino.y = GROUND_Y;
        dino.vy = 0;
        dino.jumping = false;
      }

      if (frame % Math.max(50, Math.floor(90 - speed * 3)) === 0) {
        spawnObstacle();
      }

      speed += 0.0025;
      score += 1;

      for (const o of obstacles) {
        o.x -= speed;
      }
      obstacles = obstacles.filter(o => o.x + o.w > 0);

      for (const o of obstacles) {
        const dinoBox = { x: dino.x + 4, y: dino.y + 4, w: dino.w - 8, h: dino.h - 8 };
        const obsBox = { x: o.x, y: o.y, w: o.w, h: o.h };
        if (
          dinoBox.x < obsBox.x + obsBox.w &&
          dinoBox.x + dinoBox.w > obsBox.x &&
          dinoBox.y < obsBox.y + obsBox.h &&
          dinoBox.y + dinoBox.h > obsBox.y
        ) {
          endGame();
        }
      }
    }

    function endGame() {
      running = false;
      gameOver = true;
      const finalScore = Math.floor(score / 5);
      if (finalScore > highScore) {
        highScore = finalScore;
        localStorage.setItem('dinoHighScore', String(highScore));
      }
      hint.textContent = 'Perdu ! Espace ou clic pour recommencer';
    }

    function drawGround() {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      const waveOffset = (frame * speed * 0.5) % 24;
      for (let x = -waveOffset; x < canvas.width; x += 24) {
        ctx.beginPath();
        ctx.arc(x, GROUND_Y + 30, 6, Math.PI, 0);
        ctx.stroke();
      }
    }

    function drawWing(cx, cy, side) {
      ctx.fillStyle = '#f2f2f2';
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      for (let i = 0; i <= 4; i++) {
        const spread = side * (10 + i * 7);
        const lift = -4 - i * 6 + Math.sin(frame / 10 + i) * 2;
        ctx.lineTo(cx + spread, cy + lift);
        ctx.lineTo(cx + spread * 0.7, cy + lift + 8);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#c9c9c9';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function drawFlameTrail(x, y) {
      const flicker = Math.sin(frame / 3) * 2;
      const colors = ['#ff6a00', '#ffb400', '#ff3d00'];
      for (let i = 0; i < 5; i++) {
        const fx = x - 4 - i * 5;
        const fy = y + 18 + Math.sin(frame / 4 + i) * 3;
        const size = 6 - i;
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.lineTo(fx - size, fy + size + flicker);
        ctx.lineTo(fx + size, fy + size + flicker);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawClubGuy() {
      const x = dino.x;
      const y = dino.y;
      const legFrame = Math.floor(frame / 6) % 2;
      const suitColor = '#f5f5f5';
      const skinColor = '#e8b98a';

      // Aura légendaire
      const glow = ctx.createRadialGradient(x + 15, y + 6, 4, x + 15, y + 6, 34);
      glow.addColorStop(0, 'rgba(255, 215, 80, 0.55)');
      glow.addColorStop(1, 'rgba(255, 215, 80, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(x - 25, y - 30, 80, 80);

      // Traînée de flammes
      drawFlameTrail(x, y);

      // Ailes (derrière le corps)
      drawWing(x + 4, y + 10, -1);
      drawWing(x + 20, y + 10, 1);

      // Jambes
      ctx.fillStyle = suitColor;
      if (!dino.jumping) {
        if (legFrame === 0) {
          ctx.fillRect(x + 6, y + 20, 6, 10);
          ctx.fillRect(x + 18, y + 20, 6, 7);
        } else {
          ctx.fillRect(x + 6, y + 20, 6, 7);
          ctx.fillRect(x + 18, y + 20, 6, 10);
        }
      } else {
        ctx.fillRect(x + 6, y + 20, 6, 8);
        ctx.fillRect(x + 18, y + 20, 6, 8);
      }

      // Torse (costume blanc)
      ctx.fillRect(x + 4, y + 6, 22, 16);

      // Bras levé avec coupe de champagne
      ctx.fillStyle = suitColor;
      const armLift = dino.jumping ? -4 : 0;
      ctx.fillRect(x + 22, y - 6 + armLift, 5, 14);
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(x + 23, y - 10 + armLift, 3, 5);
      ctx.fillStyle = '#f7e97a';
      ctx.fillRect(x + 23, y - 12 + armLift, 3, 3);

      // Tête
      ctx.fillStyle = skinColor;
      ctx.fillRect(x + 6, y - 8, 12, 12);

      // Cheveux blonds
      ctx.fillStyle = '#e8c766';
      ctx.fillRect(x + 5, y - 11, 14, 5);

      // Oeil
      ctx.fillStyle = '#2a1a0a';
      ctx.fillRect(x + 14, y - 4, 2, 2);
    }

    function drawObstacles() {
      for (const o of obstacles) {
        if (o.type === 'disco') {
          ctx.fillStyle = '#c9c9d6';
          ctx.beginPath();
          ctx.arc(o.x + o.w / 2, o.y + o.h / 2, o.w / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#8a8a9a';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(o.x, o.y + o.h / 2);
          ctx.lineTo(o.x + o.w, o.y + o.h / 2);
          ctx.moveTo(o.x + o.w / 2, o.y);
          ctx.lineTo(o.x + o.w / 2, o.y + o.h);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#1f5c3f';
          ctx.fillRect(o.x, o.y + 6, o.w, o.h - 6);
          ctx.fillStyle = '#d4af37';
          ctx.fillRect(o.x + o.w / 2 - 2, o.y, 4, 8);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGround();
      drawClubGuy();
      drawObstacles();

      if (gameOver) {
        ctx.fillStyle = '#535353';
        ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 80);
      }

      const displayScore = Math.floor(score / 5);
      scoreEl.textContent = `SCORE: ${displayScore}   HI: ${highScore}`;
    }

    function loop() {
      if (running) {
        update();
      }
      draw();
      if (running) {
        requestAnimationFrame(loop);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
    });
    canvas.addEventListener('mousedown', jump);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      jump();
    }, { passive: false });

    resetGame();
    running = false;
    draw();
    scoreEl.textContent = `SCORE: 0   HI: ${highScore}`;
  </script>

</body>
</html>
