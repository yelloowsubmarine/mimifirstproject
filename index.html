<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTÈME DE SÉCURITÉ — NE PAS APPUYER</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0b0d10;
    color: #e6e6e6;
    font-family: "Courier New", monospace;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }

  .badge {
    font-size: 0.85rem;
    letter-spacing: 3px;
    color: #ff3b30;
    border: 1px solid #ff3b30;
    padding: 6px 14px;
    border-radius: 4px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  h1 {
    font-size: 1.4rem;
    max-width: 600px;
    line-height: 1.5;
    margin: 0 0 8px;
  }

  p.subtitle {
    color: #9a9a9a;
    max-width: 500px;
    margin-bottom: 48px;
    font-size: 0.95rem;
  }

  .button {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff5b4f, #c1121f 70%);
    border: 6px solid #7a0e0e;
    box-shadow: 0 0 0 8px #1a1a1a, 0 0 40px rgba(255, 0, 0, 0.5);
    cursor: pointer;
    color: white;
    font-weight: bold;
    font-size: 1.1rem;
    letter-spacing: 1px;
    transition: transform 0.08s ease;
    animation: idlePulse 1.8s ease-in-out infinite;
  }

  @keyframes idlePulse {
    0%, 100% { box-shadow: 0 0 0 8px #1a1a1a, 0 0 40px rgba(255, 0, 0, 0.5); }
    50% { box-shadow: 0 0 0 8px #1a1a1a, 0 0 60px rgba(255, 0, 0, 0.85); }
  }

  .button:active {
    transform: scale(0.92);
    box-shadow: 0 0 0 8px #1a1a1a, 0 0 60px rgba(255, 0, 0, 0.8);
  }

  .button.shake {
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 2px); }
    40% { transform: translate(6px, -2px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(4px, -2px); }
  }

  .flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }

  .flash.active {
    animation: flash 0.3s ease;
  }

  @keyframes flash {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  .status {
    margin-top: 32px;
    font-size: 0.85rem;
    color: #666;
    min-height: 20px;
  }

  .hack-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
  }

  .hack-overlay.active {
    opacity: 1;
  }

  .hack-overlay.active::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.06) 0px,
      rgba(255, 255, 255, 0.06) 1px,
      transparent 2px,
      transparent 4px
    );
    animation: scanlines 0.15s linear infinite;
  }

  @keyframes scanlines {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
  }

  .glitch-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.2rem;
    font-weight: bold;
    letter-spacing: 4px;
    color: #ff2b2b;
    text-shadow: 3px 0 #00f0ff, -3px 0 #ff2b2b;
    animation: glitchText 0.25s steps(2) infinite;
    white-space: nowrap;
  }

  @keyframes glitchText {
    0% { transform: translate(-50%, -50%) skewX(0deg); }
    25% { transform: translate(calc(-50% + 3px), -50%) skewX(2deg); }
    50% { transform: translate(calc(-50% - 3px), -50%) skewX(-2deg); }
    75% { transform: translate(-50%, calc(-50% + 2px)) skewX(1deg); }
    100% { transform: translate(-50%, -50%) skewX(0deg); }
  }

  .pop-item {
    position: absolute;
    border: 3px solid #fff;
    box-shadow: 0 0 25px rgba(255, 0, 0, 0.7);
    object-fit: cover;
    rotate: var(--rot);
    scale: 0;
    opacity: 0;
    animation:
      popIn 0.3s ease forwards,
      floaty var(--float-dur, 5s) ease-in-out infinite;
    animation-delay: 0s, var(--float-delay, 0s);
  }

  @keyframes popIn {
    0% { scale: 0; opacity: 0; }
    60% { scale: 1.15; opacity: 1; }
    100% { scale: 1; opacity: 1; }
  }

  @keyframes floaty {
    0%, 100% { translate: 0 0; }
    25% { translate: var(--fx1, 15px) var(--fy1, -20px); }
    50% { translate: var(--fx2, -12px) var(--fy2, 18px); }
    75% { translate: var(--fx3, 14px) var(--fy3, 10px); }
  }

  .pop-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    color: #fff;
    font-size: 8vw;
  }

  body.hacking {
    animation: bodyShake 0.15s linear infinite;
  }

  @keyframes bodyShake {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(2px, -2px); }
  }

  .gyro-layer {
    position: fixed;
    inset: 0;
    z-index: 15;
    pointer-events: none;
  }

  .gyro {
    position: absolute;
    width: 45vw;
    height: 45vw;
    max-width: 420px;
    max-height: 420px;
    border-radius: 50%;
    filter: blur(35px);
    opacity: 0;
    mix-blend-mode: screen;
  }

  .hacking .gyro {
    animation-name: gyroFlash;
    animation-duration: 0.3s;
    animation-timing-function: steps(1);
    animation-iteration-count: infinite;
  }

  @keyframes gyroFlash {
    0%, 49% { background: #ff1e1e; opacity: 0.75; }
    50%, 100% { background: #1e6bff; opacity: 0.75; }
  }
</style>
</head>
<body>

  <div class="badge">⚠ Confidentiel — Niveau 1</div>
  <h1>Procédure d'urgence nationale</h1>
  <p class="subtitle">
    Ce dispositif ne doit être activé qu'en cas d'extrême nécessité.
    Toute activation non autorisée sera enregistrée.
  </p>

  <button class="button" id="bigRedButton">NE PAS<br>APPUYER</button>

  <div class="status" id="status"></div>

  <audio id="sound" src="sounds/clip.mp3" preload="auto"></audio>
  <div class="flash" id="flash"></div>
  <div class="hack-overlay" id="hackOverlay">
    <div class="glitch-text">SYSTÈME COMPROMIS</div>
  </div>

  <div class="gyro-layer" id="gyroLayer"></div>

  <script>
    const button = document.getElementById('bigRedButton');
    const sound = document.getElementById('sound');
    const flash = document.getElementById('flash');
    const status = document.getElementById('status');
    const hackOverlay = document.getElementById('hackOverlay');

    // Liste des images "wtf" à faire apparaître au clic.
    // Ajoute simplement le nom des fichiers déposés dans le dossier images/.
    const wtfImages = [
      'images/img1.webp',
      'images/img2.webp',
      'images/img3.webp',
      'images/img4.png',
      'images/img5.webp',
      'images/img6.webp',
    ];

    const fallbackEmojis = ['🐶', '😱', '🚨', '🤯', '📸'];

    function spawnHackImages() {
      hackOverlay.innerHTML = '<div class="glitch-text">SYSTÈME COMPROMIS</div>';

      function applyFloatStyle(el, size, left, top, rot) {
        el.style.setProperty('--rot', rot);
        el.style.width = size + 'vw';
        el.style.height = size + 'vw';
        el.style.left = left + '%';
        el.style.top = top + '%';
        el.style.setProperty('--float-dur', (3 + Math.random() * 3).toFixed(2) + 's');
        el.style.setProperty('--float-delay', (-Math.random() * 5).toFixed(2) + 's');
        el.style.setProperty('--fx1', (Math.random() * 40 - 20).toFixed(0) + 'px');
        el.style.setProperty('--fy1', (Math.random() * 40 - 20).toFixed(0) + 'px');
        el.style.setProperty('--fx2', (Math.random() * 40 - 20).toFixed(0) + 'px');
        el.style.setProperty('--fy2', (Math.random() * 40 - 20).toFixed(0) + 'px');
        el.style.setProperty('--fx3', (Math.random() * 40 - 20).toFixed(0) + 'px');
        el.style.setProperty('--fy3', (Math.random() * 40 - 20).toFixed(0) + 'px');
      }

      // Zone centrale à éviter pour laisser le bouton cliquable (en %).
      function randomPosAwayFromButton() {
        let left, top, tries = 0;
        do {
          left = Math.random() * 65;
          top = Math.random() * 60;
          tries++;
        } while (left > 15 && left < 55 && top > 20 && top < 60 && tries < 20);
        return { left, top };
      }

      const count = 10;
      for (let i = 0; i < count; i++) {
        const delay = i * 110;
        setTimeout(() => {
          const src = wtfImages[Math.floor(Math.random() * wtfImages.length)];
          const size = 30 + Math.random() * 16; // en vw, donc responsive
          const { left, top } = randomPosAwayFromButton();
          const rot = (Math.random() * 60 - 30).toFixed(1) + 'deg';

          const img = document.createElement('img');
          img.src = src;
          img.className = 'pop-item';
          applyFloatStyle(img, size, left, top, rot);

          img.onerror = () => {
            const fallback = document.createElement('div');
            fallback.className = 'pop-item pop-fallback';
            applyFloatStyle(fallback, size, left, top, rot);
            fallback.textContent = fallbackEmojis[Math.floor(Math.random() * fallbackEmojis.length)];
            img.replaceWith(fallback);
          };

          hackOverlay.appendChild(img);
        }, delay);
      }
    }

    const gyroLayer = document.getElementById('gyroLayer');

    function spawnGyros() {
      gyroLayer.innerHTML = '';
      const count = 10;
      for (let i = 0; i < count; i++) {
        const gyro = document.createElement('div');
        gyro.className = 'gyro';
        gyro.style.left = (Math.random() * 100 - 15) + '%';
        gyro.style.top = (Math.random() * 100 - 15) + '%';
        gyro.style.animationDelay = (i % 2 === 0 ? '0s' : '0.15s');
        gyroLayer.appendChild(gyro);
      }
    }

    let clickCount = 0;

    sound.preservesPitch = false;
    sound.mozPreservesPitch = false;
    sound.webkitPreservesPitch = false;

    button.addEventListener('click', () => {
      button.classList.remove('shake');
      void button.offsetWidth; // relance l'animation
      button.classList.add('shake');

      flash.classList.remove('active');
      void flash.offsetWidth;
      flash.classList.add('active');

      document.body.classList.add('hacking');
      hackOverlay.classList.add('active');
      spawnHackImages();
      spawnGyros();

      setTimeout(() => {
        document.body.classList.remove('hacking');
      }, 2000);

      clickCount++;
      sound.currentTime = 0;
      sound.playbackRate = Math.min(1 + clickCount * 0.15, 2.8);
      sound.play().catch(() => {
        status.textContent = "Ajoute ton fichier audio dans sounds/clip.mp3 pour entendre le son !";
      });
    });
  </script>

</body>
</html>
