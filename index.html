<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTÈME DE SÉCURITÉ — NE PAS APPUYER</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0b0d10;
    color: #e6e6e6;
    font-family: "Courier New", monospace;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }

  .badge {
    font-size: 0.85rem;
    letter-spacing: 3px;
    color: #ff3b30;
    border: 1px solid #ff3b30;
    padding: 6px 14px;
    border-radius: 4px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  h1 {
    font-size: 1.4rem;
    max-width: 600px;
    line-height: 1.5;
    margin: 0 0 8px;
  }

  p.subtitle {
    color: #9a9a9a;
    max-width: 500px;
    margin-bottom: 48px;
    font-size: 0.95rem;
  }

  .button {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff5b4f, #c1121f 70%);
    border: 6px solid #7a0e0e;
    box-shadow: 0 0 0 8px #1a1a1a, 0 0 40px rgba(255, 0, 0, 0.5);
    cursor: pointer;
    color: white;
    font-weight: bold;
    font-size: 1.1rem;
    letter-spacing: 1px;
    transition: transform 0.08s ease;
  }

  .button:active {
    transform: scale(0.92);
    box-shadow: 0 0 0 8px #1a1a1a, 0 0 60px rgba(255, 0, 0, 0.8);
  }

  .button.shake {
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 2px); }
    40% { transform: translate(6px, -2px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(4px, -2px); }
  }

  .flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }

  .flash.active {
    animation: flash 0.3s ease;
  }

  @keyframes flash {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  .status {
    margin-top: 32px;
    font-size: 0.85rem;
    color: #666;
    min-height: 20px;
  }
</style>
</head>
<body>

  <div class="badge">⚠ Confidentiel — Niveau 1</div>
  <h1>Procédure d'urgence nationale</h1>
  <p class="subtitle">
    Ce dispositif ne doit être activé qu'en cas d'extrême nécessité.
    Toute activation non autorisée sera enregistrée.
  </p>

  <button class="button" id="bigRedButton">NE PAS<br>APPUYER</button>

  <div class="status" id="status"></div>

  <audio id="sound" src="sounds/clip.mp3" preload="auto"></audio>
  <div class="flash" id="flash"></div>

  <script>
    const button = document.getElementById('bigRedButton');
    const sound = document.getElementById('sound');
    const flash = document.getElementById('flash');
    const status = document.getElementById('status');

    button.addEventListener('click', () => {
      button.classList.remove('shake');
      void button.offsetWidth; // relance l'animation
      button.classList.add('shake');

      flash.classList.remove('active');
      void flash.offsetWidth;
      flash.classList.add('active');

      sound.currentTime = 0;
      sound.play().catch(() => {
        status.textContent = "Ajoute ton fichier audio dans sounds/clip.mp3 pour entendre le son !";
      });
    });
  </script>

</body>
</html>
